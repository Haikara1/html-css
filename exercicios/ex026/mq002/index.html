<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation:portrait)">
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation:landscape)">
    <link rel="stylesheet" href="estilos/style.css" media="all">
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>

<!-- Quando eu uso media ="" eu posso adicionar media features que são indicadas por exemplo: media="screen and (orientation:portrait)" sendo: and (orientation:portrait) a media feature. Caso eu tenha mais de uma media feature, eu repito o processo de parentese.  -->

<!-- media ="all" abrange todos os outros (screen ou print) -->
