<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>


<!-- display: flex; sempre vai dentro do "pai" que é o flex-container. É o flex-container que vai conter todos os items  -->

 <!-- flex-direction: row; é sempre deitado e da esquerda pra direita (row = linha) -->
  <!-- Caso queira ver o desenho de como tudo funciona, dá pra ver no material em pdf do curso -->

  <!-- flex-flow é uma shorthand, ex: ao invés de usar flex-direction: row; e flex-wrap: nowrap; você pode usar flex-flow: row nowrap; é recomendado sempre usar no lugar dos outros.-->

  <!-- justify-content vai fazer o alinhamento em relacao ao main-axis

    justify-content: flex-start - o primeiro item vai ficar grudado no main-start e o espaço em branco vai ser jogado para o final do eixo principal

    justify-content: flex-end - o ultimo item vai ser grudado no main-end e o espaço em branco vai ficar condençado no main-start.

    justify-content: center - Calcula o centro do container fazendo com que os espaços em branco sejam no main-start e no main-end.

    justify-content: space-between - ele coloca o primeiro item no main-start e o ultimo item no main-end. (o espaço em branco é distribuído por igual)

    justify-content: space-evenly - faz com que antes e depois dos items exista um espaçamento igual. (inclusive antes e depois do primeiro e do ultimo item)

    justify-content: space-around - Cria um espaço em volta de cada item dentro do container e um espaço entre eles (um item tem espaço no inicio e no final)


  -->
