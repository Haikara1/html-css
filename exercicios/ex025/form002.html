<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário</label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="30" size="10" placeholder="nome do usuário" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" placeholder="mínimo 8 letras" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>


<!-- Para formulário, é importante usar method="get" ou method="post" (caso sejam dados sensíveis o POST é obrigatório) -->

<!-- Caso seja relacionado a LOGIN, o uso de Required torna melhor a experiencia, para que o usuário saiba o que e quantas letras está usando

ex: <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15">

nesse caso o minLength="5" é o minimo de caracteres para uso e o maxLength="15" é o máximo de caracteres para uso naquele site-->

<!-- <input type="password" name="sen" id="isen"> é exclusivo para senhas e já vem com o conteúdo oculto para segurança-->

<!-- <input type="reset" value="Limpar"> Serve para limpar os campos de um formulário. Ele limpa todos os campos de uma vez só -->

<!-- É possível adicionar uma "previa" na caixa de usuário/senha usando o placeholder="" -->

<!-- Também é possível utilizar o autocomplete dentro do seu input para que o navegador consiga autoCompletar o seu usuário/senha ou outros dados importantes que você já utiliza com frequencia (Ex: CEP, CPF, RG e etc..)

porém se você quiser esconder tudo isso, basta usar o autoComplete="off" dentro do seu form-->
